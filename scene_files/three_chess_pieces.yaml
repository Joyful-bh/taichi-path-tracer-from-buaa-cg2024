# 无损迁移自：重构光线追踪/三个国际象棋.py
render:
  backend: cuda
  width: 1400
  height: 800
  samples_per_pixel: 20000
  max_bounce: 30
  output: output/three_chess_pieces.png
  samples_per_batch: 16       # 每次 GPU kernel 为活跃像素追加的样本数；越大启动开销越低，但预览更新越慢
  save_aovs: false            # 关闭时固定采样快速 kernel 不写 AOV；开启后保存额外 AOV PNG
  denoising:
    enabled: false            # OIDN 总开关；开启后自动在内存中生成引导 AOV，不要求 save_aovs=true
    executable: auto          # auto 从 PATH/OIDN_DENOISE_EXECUTABLE 查找，也可填写 oidnDenoise.exe 绝对路径
    device: default           # default 自动选择；也可用 cpu/cuda/sycl/hip/metal（须由安装包支持）
    quality: high             # high 画质优先；balanced/fast 更快但不建议用于最终高保真输出
    use_albedo: true          # 用反照率约束材质边界，通常是最重要的引导信息
    use_normal: true          # 用世界空间着色法线约束几何边缘和表面细节
    save_noisy: true          # 同时保留 output 原始图；降噪图默认在文件名后加 _denoised
    output: null              # null 自动命名；也可指定降噪结果路径
  adaptive_sampling:
    enabled: false            # 当前默认关闭；所有像素统一渲染 samples_per_pixel，并使用固定采样快速 kernel
    min_spp: 64               # 每个像素在首次判断收敛前必须达到的最低样本数
    max_spp: 20000            # 难收敛像素的最高样本数；开启时也是整次渲染的 SPP 上限
    check_interval: 32        # 每累计多少 spp 检查一次收敛；越小响应越快，但检查开销越高
    relative_error: 0.015     # 相对标准误差阈值；越小画质越稳、耗时越长
    absolute_error: 0.001     # 绝对标准误差阈值，防止接近黑色区域因相对误差过大而无法停止

background: [0.01, 0.01, 0.01]

camera:
  position: [0.0, -2.8, 6.3]
  look_at:  [0.0, -2.8, -5.0]
  up:       [0.0, 1.0, 0.0]
  fov:      70.0
  aperture: 0.0

variables:
  room_size: 10.5

materials:
  - name: green_mirror
    type: metal
    albedo: [0.1, 0.99, 0.05]
    fuzz: 0.05
  - name: blue_mirror
    type: metal
    albedo: [0.09, 0.7, 0.99]
    fuzz: 0.2
  - name: red_mirror
    type: metal
    albedo: [1.0, 0.01, 0.01]
    fuzz: 0.05
  - name: white_mirror
    type: metal
    albedo: [0.73, 0.73, 0.73]
    fuzz: 0.02
  - name: black_mirror
    type: metal
    albedo: [0.08, 0.08, 0.08]
    fuzz: 0.02
  - name: grey_wall
    type: lambertian
    albedo: [0.18, 0.18, 0.18]
  - name: front_wall
    type: lambertian
    albedo: [0.9, 0.9, 0.9]
    backcull: 1
  - name: ceiling_light
    type: light
    emit: [1.0, 1.0, 1.0]
    intensity: 6.0

objects:
  - type: checkerboard
    center: [0.0, -5.0, 0.0]
    tiles_x: 5
    tiles_z: 5
    tile_size: 2.0
    materials: [white_mirror, black_mirror]
    rotation: [90.0, 0.0, 0.0]
  - type: rectangle
    material: white
    center: [0.0, 3.5, 0.0]
    width: room_size
    height: room_size
    rotation: [90.0, 0.0, 0.0]
  - type: rectangle
    material: blue_mirror
    center: [0.0, 0.0, -5.0]
    width: room_size
    height: room_size
    rotation: [0.0, 0.0, 0.0]
  - type: rectangle
    material: front_wall
    center: [0.0, 0.0, 4.0]
    width: room_size
    height: room_size
    rotation: [0.0, 180.0, 0.0]
  - type: rectangle
    material: red_mirror
    center: [-5.0, 0.0, 0.0]
    width: room_size
    height: room_size
    rotation: [0.0, -90.0, 0.0]
  - type: rectangle
    material: green_mirror
    center: [5.0, 0.0, 0.0]
    width: room_size
    height: room_size
    rotation: [0.0, -90.0, 0.0]
  - type: rectangle
    material: ceiling_light
    center: [0.0, 3.49, -1.0]
    width: 5.0
    height: 4.0
    rotation: [90.0, 0.0, 0.0]
  - type: mesh
    model: ../data/knight.obj
    material: grey_wall
    transform:
      scale: 1.2
      translate: [-2.0, -5.0, 2.0]
      rotate: [0.0, 70.0, 0.0]
  - type: mesh
    model: ../data/king.obj
    material: white
    transform:
      scale: 1.1
      translate: [0.0, -5.0, -2.0]
      rotate: [0.0, 120.0, 0.0]
  - type: mesh
    model: ../data/queen.obj
    material: white
    transform:
      scale: 1.1
      translate: [2.0, -5.0, 0.0]
      rotate: [0.0, 30.0, 0.0]
