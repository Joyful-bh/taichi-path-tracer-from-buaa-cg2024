# 迁移自：重构光线追踪/渲染龙.py
# 旧脚本未固定随机种子；此预设保留原生成规则并固定 seed 以便复现。
render:
  backend: cuda
  width: 2560
  height: 1440
  samples_per_pixel: 30000
  max_bounce: 30
  output: output/dragon_and_spheres.png
  samples_per_batch: 16       # 每次 GPU kernel 为活跃像素追加的样本数；越大启动开销越低，但预览更新越慢
  save_aovs: false            # 仅控制是否保存额外 AOV PNG；自适应所需的内部统计仍会正常计算
  adaptive_sampling:
    enabled: true             # 是否跳过已经收敛的像素；关闭后所有像素统一渲染 samples_per_pixel
    min_spp: 64               # 每个像素在首次判断收敛前必须达到的最低样本数
    max_spp: 30000            # 难收敛像素的最高样本数；开启时也是整次渲染的 SPP 上限
    check_interval: 32        # 每累计多少 spp 检查一次收敛；越小响应越快，但检查开销越高
    relative_error: 0.015     # 相对标准误差阈值；越小画质越稳、耗时越长
    absolute_error: 0.001     # 绝对标准误差阈值，防止接近黑色区域因相对误差过大而无法停止

background:
  type: gradient
  bottom: [0.2, 0.45, 0.9]
  top: [0.05, 0.35, 0.8]

camera:
  position: [-1.0, 10.8, 30.0]
  look_at:  [-1.0, 5.8, 0.0]
  up:       [0.0, 1.0, 0.0]
  fov:      50.0
  aperture: 0.2
  focus_dist: 25.0

materials:
  - name: dragon_clearcoat
    type: clearcoat
    albedo: [0.45, 0.9, 0.4]
    spec_prob: 0.3
    roughness: 0.08
  - name: ground_red
    type: lambertian
    albedo: [0.9, 0.1, 0.1]
  - name: sun
    type: light
    emit: [1.0, 1.0, 1.0]
    intensity: 10.0

objects:
  - type: sphere
    material: sun
    center: [-130.0, 70.0, -90.0]
    radius: 35.0
  - type: sphere
    material: ground_red
    center: [0.0, -10000.0, 0.0]
    radius: 10000.0
  - type: mesh
    model: ../data/dragon.obj
    material: dragon_clearcoat
    transform:
      scale: 20.0
      translate: [-2.0, 3.1, 3.0]
      rotate: [0.0, 120.0, 0.0]
  - type: random_spheres
    seed: 20251018
    count: 300
    inner_radius: 9.0
    outer_radius: 110.0
    min_radius: 2.0
    max_radius: 3.0
    max_attempts: 1000
    material_weights:
      lambertian: 0.7
      metal: 0.05
      dielectric: 0.1
      clearcoat: 0.15
