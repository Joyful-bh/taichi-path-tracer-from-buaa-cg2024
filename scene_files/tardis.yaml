render:
  backend: cuda
  width: 1000
  height: 1200
  samples_per_pixel: 512
  max_bounce: 20
  output: output/tardis.png
  samples_per_batch: 16       # 每次 GPU kernel 为活跃像素追加的样本数；越大启动开销越低，但预览更新越慢
  save_aovs: false            # 仅控制是否保存额外 AOV PNG；自适应所需的内部统计仍会正常计算
  adaptive_sampling:
    enabled: true             # 是否跳过已经收敛的像素；关闭后所有像素统一渲染 samples_per_pixel
    min_spp: 64               # 每个像素在首次判断收敛前必须达到的最低样本数
    max_spp: 512              # 难收敛像素的最高样本数；开启时也是整次渲染的 SPP 上限
    check_interval: 32        # 每累计多少 spp 检查一次收敛；越小响应越快，但检查开销越高
    relative_error: 0.015     # 相对标准误差阈值；越小画质越稳、耗时越长
    absolute_error: 0.001     # 绝对标准误差阈值，防止接近黑色区域因相对误差过大而无法停止

# 晴天蓝天，提供天空环境光（稍亮以增强轮廓）
background: [0.50, 0.68, 0.92]

# 3/4 正面偏右视角，略微俯视
camera:
  position: [1.5, 1.5, 5.5]
  look_at:  [0.0, 1.3, 0.0]
  up:       [0, 1, 0]
  fov:      40.0
  aperture: 0.0

variables:
  ground_y: 0.0

materials:
  - name: ground
    type: lambertian
    albedo: [0.38, 0.35, 0.32]   # 略暖的混凝土灰

  # 主光：暖白日光（上方偏前左）
  # rotation [90,0,0] → 法线朝下(-Y)；Tardis 朝上散射的路径命中正面
  # intensity 从 15 降至 1.0：Wood_Mat albedo≈0.088，原来 0.088×33=2.9→ACES→0.95 全白
  # 降至 1.0 后 0.088×2.2=0.19→ACES→0.18→display≈0.46，保留深蓝色
  - name: light_key
    type: light
    emit:      [2.2, 2.0, 1.70]
    intensity: 0.5

  # 正面补光：冷蓝色，置于摄像机背后，法线朝 -Z 朝向场景
  - name: light_front
    type: light
    emit:      [0.80, 0.95, 1.20]
    intensity: 0.35

  # 侧面补光：略带暖色，右侧
  - name: light_side
    type: light
    emit:      [1.00, 0.95, 0.80]
    intensity: 0.2

objects:
  # ── 主光（左前上方，模拟偏前的阳光）──────────────────────────────
  # 位于 z=5 与摄像机近似同平面但偏左上，对正面贡献大余弦角
  - type: rectangle
    material: light_key
    center:   [-3.0, 5.5, 5.0]
    width:    10.0
    height:   10.0
    rotation: [90, 0, 0]

  # ── 正面补光（摄像机后方，法线向场景）────────────────────────────
  # 在 Tardis 正面 +Z 方向放置，高度接近 Tardis 中部，直接照亮前脸
  - type: rectangle
    material: light_front
    center:   [2.0, 2.5, 7.0]
    width:    7.0
    height:   7.0
    rotation: [0, 180, 0]

  # ── 侧面补光（右侧，模拟天空侧光）──────────────────────────────
  - type: rectangle
    material: light_side
    center:   [5.0, 3.0, 1.0]
    width:    5.0
    height:   5.0
    rotation: [0, -90, 0]

  # ── 地面 ──────────────────────────────────────────────────────────
  - type: rectangle
    material: ground
    center:   [0, "ground_y", 0]
    width:    40.0
    height:   40.0
    rotation: [90, 0, 0]

  # ── Tardis 模型 ───────────────────────────────────────────────────
  # 模型经场景图变换后已是 Y-up，底部 Y≈0，高约 2.69，宽约 1.39
  - type: mesh
    model: ../data/tardis.glb
    transform:
      scale:     1.0
      translate: [0, "ground_y", 0]
      rotate:    [0, 45, 0]
    material_override:
      # Tardis_Wood_Mat：主体外壳，使用原贴图色（均值 ≈ 0.088,0.117,0.147，深海军蓝）
      # 原贴图 metallic=1.0，无NEE的路径追踪对纯金属采样效率低 → 降至 0.15 让漫反射主导
      # roughness 显式保留原贴图均值 0.61，避免 mr_tex_id=-1 后退回默认值
      Tardis_Wood_Mat:
        metallic: 0.15
        roughness: 0.61

      # Tardis_Metal_Mat：顶部灯座，原 baseColorFactor=(10,13,22) 为 Blender 导出异常
      # 改为蓝银色，稍带金属感
      Tardis_Metal_Mat:
        albedo: [0.55, 0.65, 0.78]
        metallic: 0.4
        roughness: 0.2

      # Decals_Mat：Police Box 标牌，原贴图均值 ≈ 0.256（灰白）
      # 略微提亮为奶白色，关闭金属感
      Decals_Mat:
        albedo: [0.72, 0.72, 0.68]
        metallic: 0.0
        roughness: 0.45

      # Gold_Mat：五金件（当前视角不可见），金色高光金属
      Gold_Mat:
        albedo: [0.70, 0.45, 0.04]
        metallic: 0.7
        roughness: 0.2
